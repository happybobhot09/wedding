        const STORAGE_KEY_MASTERED = 'bohan_lulu_wedding_trivia_mastered_v1';

        function prepareQuizRound(rawQuestions, shuffleOrder = false) {
            const list = [...rawQuestions];
            if (shuffleOrder) {
                for (let i = list.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [list[i], list[j]] = [list[j], list[i]];
                }
            }
            return list.map((q) => {
                const optionObjects = q.options.map((text, idx) => ({
                    text,
                    isCorrect: idx === q.correctIndex
                }));
                for (let i = optionObjects.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionObjects[i], optionObjects[j]] = [optionObjects[j], optionObjects[i]];
                }
                return {
                    ...q,
                    shuffledOptions: optionObjects.map((o) => o.text),
                    shuffledCorrectIndex: optionObjects.findIndex((o) => o.isCorrect)
                };
            });
        }

        function playSoundEffect(type, enabled) {
            if (!enabled || typeof window === 'undefined') return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const now = ctx.currentTime;
                if (type === 'correct') {
                    [523.25, 659.25, 783.99].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.12, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.26);
                    });
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.linearRampToValueAtTime(190, now + 0.25);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'fanfare') {
                    [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0.14, now + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.36);
                    });
                }
            } catch (e) {}
        }

        function App() {
            const [questions, setQuestions] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [loadError, setLoadError] = useState(null);

            const [masteredIds, setMasteredIds] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY_MASTERED);
                    if (saved) return JSON.parse(saved);
                } catch (e) {}
                return [];
            });

            const [screen, setScreen] = useState('home');
            const [activeCategory, setActiveCategory] = useState(null);
            const [quizList, setQuizList] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [roundHistory, setRoundHistory] = useState([]);
            const [soundEnabled, setSoundEnabled] = useState(true);

            const [isEditorOpen, setIsEditorOpen] = useState(false);
            const [editingQuestion, setEditingQuestion] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            // Fetch external questions.json on mount
            useEffect(() => {
                fetch('questions.json')
                    .then((res) => {
                        if (!res.ok) throw new Error('無法載入 questions.json 檔案');
                        return res.json();
                    })
                    .then((data) => {
                        if (Array.isArray(data)) {
                            setQuestions(data);
                        } else {
                            throw new Error('questions.json 格式錯誤');
                        }
                        setIsLoading(false);
                    })
                    .catch((err) => {
                        console.error(err);
                        setLoadError(err.message);
                        setIsLoading(false);
                    });
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_KEY_MASTERED, JSON.stringify(masteredIds));
                } catch (e) {}
            }, [masteredIds]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => {
                    setToastMessage((prev) => (prev === msg ? null : prev));
                }, 2600);
            };

            const startCategoryQuiz = (catId) => {
                const filtered = catId === 'all' ? questions : questions.filter((q) => q.category === catId);
                if (filtered.length === 0) {
                    showToast('此分類目前沒有題目，請先新增題目！');
                    return;
                }
                const prepared = prepareQuizRound(filtered, catId === 'all');
                setActiveCategory(CATEGORIES.find((c) => c.id === catId));
                setQuizList(prepared);
                setCurrentIndex(0);
                setSelectedOption(null);
                setRoundHistory([]);
                setScreen('quiz');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleSelectOption = (optIndex) => {
                if (selectedOption !== null) return;
                setSelectedOption(optIndex);
                const currentQ = quizList[currentIndex];
                const isCorrect = optIndex === currentQ.shuffledCorrectIndex;
                if (isCorrect) {
                    playSoundEffect('correct', soundEnabled);
                    if (!masteredIds.includes(currentQ.id)) {
                        setMasteredIds((prev) => [...prev, currentQ.id]);
                    }
                } else {
                    playSoundEffect('wrong', soundEnabled);
                }
                setRoundHistory((prev) => [
                    ...prev,
                    {
                        id: currentQ.id,
                        question: currentQ.question,
                        selectedText: currentQ.shuffledOptions[optIndex],
                        correctText: currentQ.shuffledOptions[currentQ.shuffledCorrectIndex],
                        explanation: currentQ.explanation,
                        isCorrect
                    }
                ]);
            };

            const handleNextQuestion = () => {
                if (currentIndex + 1 < quizList.length) {
                    setCurrentIndex((prev) => prev + 1);
                    setSelectedOption(null);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    playSoundEffect('fanfare', soundEnabled);
                    setScreen('result');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const masteryStats = useMemo(() => {
                const total = questions.length;
                const validMastered = masteredIds.filter((id) => questions.some((q) => q.id === id)).length;
                const percent = total > 0 ? Math.round((validMastered / total) * 100) : 0;
                return { total, validMastered, percent };
            }, [questions, masteredIds]);

            const handleSaveQuestion = (e) => {
                e.preventDefault();
                if (!editingQuestion.question.trim()) return;
                const exists = questions.some((q) => q.id === editingQuestion.id);
                if (exists) {
                    setQuestions((prev) => prev.map((q) => (q.id === editingQuestion.id ? editingQuestion : q)));

                                <div className="px-5 py-4 bg-white border-b border-[#E6DCD2] flex items-center justify-between">
                                    <div>
                                        <h3 className="font-serif-tc font-bold text-base text-[#2C2523]">⚙️ 題庫編輯與 JSON 下載</h3>
                                        <p className="text-[11px] text-[#8C7A6B]">修改後可點擊下方下載更新檔覆蓋專案中的 questions.json</p>
                                    </div>
                                    <button
                                        onClick={() => {
                                            setEditingQuestion(null);
                                            setIsEditorOpen(false);
                                        }}
                                        className="px-3 py-1.5 rounded-full bg-[#FAF7F2] border border-[#E6DCD2] text-xs font-bold text-[#5C4D44]"
                                    >
                                        完成關閉
                                    </button>
                                </div>
                                <div className="p-4 overflow-y-auto flex-1 space-y-4">
                                    {editingQuestion ? (
                                        <form onSubmit={handleSaveQuestion} className="space-y-3 bg-white p-4 rounded-2xl border border-[#E6DCD2]">
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs font-bold text-[#8C6D53]">編輯題目內容</span>
                                                <button type="button" onClick={() => setEditingQuestion(null)} className="text-xs text-[#9A897E] underline">取消返回列表</button>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="block text-[11px] font-semibold text-[#5C4D44] mb-1">所屬分類</label>
                                                    <select
                                                        value={editingQuestion.category}
                                                        onChange={(e) => setEditingQuestion({ ...editingQuestion, category: e.target.value })}
                                                        className="w-full rounded-xl border border-[#E6DCD2] px-3 py-2 text-xs bg-[#FAF7F2]"
                                                    >
                                                        <option value="us">💕 新人甜蜜檔案</option>
                                                        <option value="travel">✈️ 愛情足跡與夢想</option>
                                                        <option value="fun">🥂 婚禮冷知識挑戰</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-[11px] font-semibold text-[#5C4D44] mb-1">趣味小標籤</label>
                                                    <input
                                                        type="text"
                                                        value={editingQuestion.tag}
                                                        onChange={(e) => setEditingQuestion({ ...editingQuestion, tag: e.target.value })}
                                                        placeholder="例：必考送分題"
                                                        className="w-full rounded-xl border border-[#E6DCD2] px-3 py-2 text-xs bg-[#FAF7F2]"
                                                    />
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold text-[#5C4D44] mb-1">題目敘述</label>
                                                <textarea
                                                    rows={2}
                                                    required
                                                    value={editingQuestion.question}
                                                    onChange={(e) => setEditingQuestion({ ...editingQuestion, question: e.target.value })}
                                                    className="w-full rounded-xl border border-[#E6DCD2] p-2.5 text-xs bg-[#FAF7F2]"
                                                />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="block text-[11px] font-semibold text-[#5C4D44]">四個選項（點選左側圓鈕設定為「正確答案」）</label>
                                                {editingQuestion.options.map((opt, idx) => (
                                                    <div key={idx} className="flex items-center gap-2">
                                                        <button
                                                            type="button"
                                                            onClick={() => setEditingQuestion({ ...editingQuestion, correctIndex: idx })}
                                                            className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold border ${editingQuestion.correctIndex === idx ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-[#FAF7F2] text-[#8C7A6B] border-[#D5C7B8]'}`}
                                                        >
                                                            {editingQuestion.correctIndex === idx ? <Icon.Check className="w-3.5 h-3.5" /> : idx + 1}
                                                        </button>
                                                        <input
                                                            type="text"
                                                            required
                                                            value={opt}
                                                            onChange={(e) => {
                                                                const updated = [...editingQuestion.options];
                                                                updated[idx] = e.target.value;
                                                                setEditingQuestion({ ...editingQuestion, options: updated });
                                                            }}
                                                            className="flex-1 rounded-xl border border-[#E6DCD2] px-3 py-1.5 text-xs bg-[#FAF7F2]"
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold text-[#5C4D44] mb-1">答題後的趣味詳解</label>
                                                <textarea
                                                    rows={3}
                                                    required
                                                    value={editingQuestion.explanation}
                                                    onChange={(e) => setEditingQuestion({ ...editingQuestion, explanation: e.target.value })}
                                                    className="w-full rounded-xl border border-[#E6DCD2] p-2.5 text-xs bg-[#FAF7F2]"
                                                />
                                            </div>
                                            <button
                                                type="submit"
                                                className="w-full py-2.5 rounded-xl bg-[#8C6D53] text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow"
                                            >
                                                <Icon.Save className="w-4 h-4" />
                                                <span>儲存這道題目</span>
                                            </button>
                                        </form>
                                    ) : (
                                        <>
                                            <div className="space-y-2">
                                                <button
                                                    onClick={handleDownloadJSON}
                                                    className="w-full py-3 px-4 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold flex items-center justify-center gap-2 shadow-sm transition active:scale-95"
                                                >
                                                    <Icon.Download className="w-4 h-4" />
                                                    <span>下載更新後的 questions.json 檔</span>
                                                </button>

                                                <button
                                                    onClick={() => setEditingQuestion({
                                                        id: 'custom-' + Date.now(),
                                                        category: 'us',
                                                        tag: '專屬加碼題',
                                                        question: '',
                                                        options: ['', '', '', ''],
                                                        correctIndex: 0,
                                                        explanation: ''
                                                    })}
                                                    className="w-full py-2.5 px-3 rounded-xl bg-[#8C6D53] text-white text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm active:scale-95 transition"
                                                >
                                                    <Icon.Plus className="w-4 h-4" />
                                                    <span>新增一道題目</span>
                                                </button>
                                            </div>

                                            <div className="space-y-2 pt-2">
                                                {questions.map((q, idx) => (
                                                    <div key={q.id} className="bg-white p-3 rounded-2xl border border-[#E6DCD2] flex items-start justify-between gap-2">
                                                        <div className="min-w-0 flex-1">
                                                            <div className="flex items-center gap-1.5 mb-1">
                                                                <span className="text-[10px] px-2 py-0.5 rounded-full bg-[#FAF3EB] text-[#8C6D53] font-semibold">
                                                                    #{idx + 1} • {q.category === 'us' ? '新人檔案' : q.category === 'travel' ? '愛情旅遊' : '婚禮冷知識'}
                                                                </span>
                                                                <span className="text-[10px] text-emerald-700 font-medium truncate">正解：{q.options[q.correctIndex]}</span>
                                                            </div>
                                                            <p className="text-xs font-bold text-[#2C2523] line-clamp-2">{q.question}</p>
                                                        </div>
                                                        <div className="flex items-center gap-1 shrink-0">
                                                            <button onClick={() => setEditingQuestion(q)} className="p-2 rounded-xl bg-[#FAF7F2] text-[#8C6D53] hover:bg-[#EFE6DD]" aria-label="編輯">
                                                                <Icon.Edit3 className="w-3.5 h-3.5" />
                                                            </button>
                                                            <button onClick={() => handleDeleteQuestion(q.id)} className="p-2 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100" aria-label="刪除">
                                                                <Icon.Trash2 className="w-3.5 h-3.5" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
