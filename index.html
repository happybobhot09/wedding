<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>柏翰 & Lulu 婚禮快問快答</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
	  body {
		font-family: 'Plus Jakarta Sans', 'Noto Serif TC', sans-serif;
		background-color: #F8F6F2;
		color: #2D2725;
		touch-action: manipulation;
	  }
	  .font-serif-tc {
		font-family: 'Noto Serif TC', serif;
	  }
	  .font-logo {
		font-family: 'Cinzel', 'Noto Serif TC', serif;
	  }

	  /* 徽章溫柔呼吸浮動動效 */
	  @keyframes gentleFloat {
		0%, 100% {
		  transform: translateY(0px) scale(1);
		  box-shadow: 0 4px 18px -2px rgba(184, 135, 100, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.8);
		}
		50% {
		  transform: translateY(-4px) scale(1.02);
		  box-shadow: 0 10px 24px -2px rgba(184, 135, 100, 0.28), inset 0 2px 6px rgba(255, 255, 255, 0.9);
		}
	  }

	  /* 外圍細緻光環慢速轉動 */
	  @keyframes slowSpin {
		from {
		  transform: rotate(0deg);
		}
		to {
		  transform: rotate(360deg);
		}
	  }

	  .badge-animate {
		animation: gentleFloat 4s ease-in-out infinite;
	  }

	  .badge-ring {
		animation: slowSpin 24s linear infinite;
	  }
	</style>
</head>
<body class="bg-[#F8F6F2] min-h-[100dvh] flex flex-col items-center p-4 sm:p-6 md:p-8">
  <div id="root" class="w-full max-w-md flex-1 flex flex-col justify-center"></div>

  <!-- 載入外部題庫檔案 (請確認檔名為 questions.js) -->
  <script src="./questions.js"></script>

  <!-- React 應用程式碼 -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const CATEGORIES = [
      { id: 'all', name: '🔥 全題庫隨機實戰', desc: '綜合所有主題，考驗你對新人的終極熟練度！', icon: '🌟', color: 'from-amber-500 to-yellow-600' },
      { id: 'groom', name: '🤵 關於新郎', desc: '新郎的小秘密、興趣怪癖與個人特色', icon: '🎩', color: 'from-sky-500 to-blue-600' },
      { id: 'bride', name: '👰 關於新娘', desc: '新娘的最愛、習慣特質與迷人之處', icon: '💐', color: 'from-rose-400 to-pink-500' },
      { id: 'couple', name: '💍 關於我們', desc: '相識戀愛史、默契考驗與甜蜜日常', icon: '🥂', color: 'from-purple-400 to-indigo-500' },
      { id: 'work', name: '💼 關於工作', desc: '職場日常、專業甘苦談與工作冷知識', icon: '💻', color: 'from-emerald-400 to-teal-500' },
      { id: 'other', name: '🎯 其他趣味', desc: '婚禮冷知識與現場驚喜雜項挑戰', icon: '💡', color: 'from-stone-400 to-stone-600' },
    ];

    function App() {
      const [questions, setQuestions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const [currentView, setCurrentView] = useState('home'); // 'home', 'quiz', 'admin'
      const [selectedCategory, setSelectedCategory] = useState(null);
      const [activeQuestions, setActiveQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [streak, setStreak] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [quizCompleted, setQuizCompleted] = useState(false);

      // 紀錄答對過的題目 ID
      const [masteredQuestionIds, setMasteredQuestionIds] = useState(() => {
        try {
          const saved = localStorage.getItem('mastered_wedding_questions');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      useEffect(() => {
        try {
          if (window.WEDDING_QUESTIONS && Array.isArray(window.WEDDING_QUESTIONS)) {
            setQuestions(window.WEDDING_QUESTIONS);
            setLoading(false);
          } else {
            throw new Error('找不到題庫變數 window.WEDDING_QUESTIONS，請確認 questions.js 是否正確載入。');
          }
        } catch (err) {
          setError(err.message);
          setLoading(false);
        }
      }, []);

      const startQuiz = (catId) => {
        let pool = [...questions];
        if (catId !== 'all') {
          pool = pool.filter(q => q.category === catId);
        }
        if (pool.length === 0) {
          alert('這個主題目前還沒有題目喔！請先至管理頁面新增題目。');
          return;
        }
        pool.sort(() => Math.random() - 0.5);
        setActiveQuestions(pool);
        setSelectedCategory(catId);
        setCurrentIndex(0);
        setScore(0);
        setStreak(0);
        setSelectedOption(null);
        setIsAnswered(false);
        setQuizCompleted(false);
        setCurrentView('quiz');
      };

      const handleSelectOption = (idx) => {
        if (isAnswered) return;
        setSelectedOption(idx);
        setIsAnswered(true);

        const currentQ = activeQuestions[currentIndex];
        const correct = idx === currentQ.answer;

        if (correct) {
          setScore(prev => prev + 10);
          setStreak(prev => prev + 1);

          // 更新掌握題目進度
          if (currentQ.id && !masteredQuestionIds.includes(currentQ.id)) {
            const nextMastered = [...masteredQuestionIds, currentQ.id];
            setMasteredQuestionIds(nextMastered);
            try {
              localStorage.setItem('mastered_wedding_questions', JSON.stringify(nextMastered));
            } catch (e) {}
          }
        } else {
          setStreak(0);
        }
      };

      const handleNext = () => {
        if (currentIndex + 1 < activeQuestions.length) {
          setCurrentIndex(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswered(false);
        } else {
          setQuizCompleted(true);
        }
      };

      if (loading) {
        return (
          <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">
            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-[#B88764] mx-auto mb-4"></div>
            <p className="text-stone-600 text-sm font-medium">正在載入婚禮題庫...</p>
          </div>
        );
      }

      if (error) {
        return (
          <div className="bg-white rounded-3xl p-6 text-center shadow-lg border border-red-100">
            <div className="text-3xl mb-3">⚠️</div>
            <h2 className="text-lg font-bold text-stone-800 mb-2">題庫載入失敗</h2>
            <p className="text-stone-500 text-xs mb-4 bg-stone-50 p-3 rounded-xl border border-stone-200">{error}</p>
            <button onClick={() => window.location.reload()} className="bg-[#B88764] text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow">
              重新載入頁面
            </button>
          </div>
        );
      }

      const totalCount = questions.length;
      const validMasteredCount = questions.filter(q => masteredQuestionIds.includes(q.id)).length;
      const progressPercent = totalCount > 0 ? Math.round((validMasteredCount / totalCount) * 100) : 0;

      return (
        <div className="flex-1 flex flex-col justify-center">
          {/* 視圖 1：首頁 (完全還原舊版優雅卡片外觀) */}
          {currentView === 'home' && (
            <div className="space-y-4">
              {/* 外層大圓角卡片 */}
              <div className="relative bg-white rounded-[32px] p-6 sm:p-7 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-[#EBE4DC]/80 flex flex-col items-center">
                
				{/* 圓形 Logo 徽章（帶慢慢的呼吸浮動與外環動效） */}
				<div className="relative mb-5 flex items-center justify-center">
				  {/* 外圍裝飾細環（極慢速優雅自轉） */}
				  <div className="badge-ring absolute w-28 h-28 rounded-full border border-dashed border-[#DFC9B5]/70 pointer-events-none"></div>

				  {/* 主體圓徽（溫柔上下呼吸浮動） */}
				  <div className="badge-animate relative w-24 h-24 rounded-full bg-gradient-to-b from-[#FDFBF9] to-[#F5ECE1] border border-[#E5D4C3] flex flex-col items-center justify-center z-10 transition-transform">
					<span className="font-logo text-xl font-bold tracking-wider text-[#735A47] drop-shadow-xs">B & L</span>
					<span className="text-[11px] font-medium text-[#9E836E] mt-0.5 tracking-tight">2026.11.22</span>
				  </div>
				</div>

                {/* 標題與活動副標 */}
                <h1 className="text-[25px] font-black text-[#2B2321] tracking-tight font-serif-tc text-center mb-1.5">
                  柏翰 & Lulu 婚禮快問快答
                </h1>
                <p className="text-[13px] font-medium text-[#C26B4A] flex items-center justify-center space-x-1 mb-6 tracking-wide text-center">
                  <span>✦</span>
                  <span>中場活動暖身練習題庫・先偷看題目拿大獎！</span>
                </p>

                {/* 熟練度內嵌卡片 */}
                <div className="w-full bg-[#FAF8F5] rounded-2xl p-4 border border-[#EFE9DF]">
                  <div className="flex items-center justify-between text-xs font-medium text-[#574842] mb-2.5">
                    <div className="flex items-center space-x-1.5">
                      <span className="text-[#B67657] text-sm">💡</span>
                      <span>問答暖身熟練度</span>
                    </div>
                    <span className="text-[#4E413B] font-bold">
                      已掌握 {validMasteredCount} / {totalCount} 題 ({progressPercent}%)
                    </span>
                  </div>

                  {/* 熟練度漸層進度條 */}
                  <div className="w-full bg-[#EAE2D8] h-2 rounded-full overflow-hidden mb-2.5">
                    <div 
                      className="h-full rounded-full transition-all duration-500 bg-gradient-to-r from-[#C98B68] to-[#E57672]"
                      style={{ width: `${progressPercent}%` }}
                    ></div>
                  </div>

                  {/* 提示說明文字 */}
                  <p className="text-[11px] text-[#7F716A] flex items-center space-x-1 leading-snug">
                    <span>💡</span>
                    <span>點選下方任一主題開始練習，每題答完都有趣味詳解喔！</span>
                  </p>
                </div>
              </div>

              {/* 題目分類按鈕清單 */}
              <div className="space-y-2.5 pt-1">
                <div className="flex items-center justify-between px-2">
                  <span className="text-xs font-bold text-stone-500 tracking-wider">選擇挑戰主題</span>

                </div>

                {CATEGORIES.map(cat => {
                  const count = cat.id === 'all' ? questions.length : questions.filter(q => q.category === cat.id).length;
                  return (
                    <button
                      key={cat.id}
                      onClick={() => startQuiz(cat.id)}
                      className="w-full text-left bg-white hover:bg-[#FDFBF7] border border-[#EAE3D9] hover:border-[#C98B68]/60 rounded-2xl p-3.5 shadow-2xs hover:shadow-xs transition-all flex items-center justify-between group active:scale-[0.99]"
                    >
                      <div className="flex items-center space-x-3.5">
                        <div className={`w-11 h-11 rounded-xl bg-gradient-to-br ${cat.color} flex items-center justify-center text-xl text-white shadow-2xs flex-shrink-0 group-hover:scale-105 transition-transform`}>
                          {cat.icon}
                        </div>
                        <div>
                          <h3 className="font-bold text-[#352B27] text-sm group-hover:text-[#9B5338] transition-colors">{cat.name}</h3>
                          <p className="text-[#887870] text-[11px] mt-0.5">{cat.desc}</p>
                        </div>
                      </div>
                      <div className="flex flex-col items-end flex-shrink-0 ml-2">
                        <span className="text-[11px] bg-[#F4EFEA] text-[#695A53] px-2 py-0.5 rounded-md font-semibold">{count} 題</span>
                        <span className="text-[#C26B4A] text-xs font-bold mt-1 group-hover:translate-x-0.5 transition-transform">➔</span>
                      </div>
                    </button>
                  );
                })}
              </div>

              <div className="text-center py-2">
                <p className="text-[11px] text-[#A69991]">祝福各位賓客婚宴玩得盡興、抱走豐富大獎！</p>
              </div>
            </div>
          )}

          {/* 視圖 2：答題中 */}
          {currentView === 'quiz' && !quizCompleted && activeQuestions.length > 0 && (
            <div className="flex-1 flex flex-col justify-between py-2">
              <div>
                {/* 頂部列 */}
                <div className="flex items-center justify-between mb-4 bg-white px-4 py-2.5 rounded-2xl border border-stone-200 text-xs font-medium text-stone-600 shadow-2xs">
                  <div className="flex items-center space-x-2">
                    <span className="bg-[#B88764] text-white px-2 py-0.5 rounded-md font-bold">
                      {currentIndex + 1} / {activeQuestions.length}
                    </span>
                    <span className="font-bold text-stone-800">{CATEGORIES.find(c => c.id === selectedCategory)?.name || '隨機題庫'}</span>
                  </div>
                  <div className="flex items-center space-x-3">
                    {streak > 1 && (
                      <span className="text-rose-600 font-bold animate-pulse">🔥 連對 {streak} 題</span>
                    )}
                    <span className="font-bold text-[#8C5E3C]">得分：{score}</span>
                  </div>
                </div>

                {/* 答題進度條 */}
                <div className="w-full bg-[#EAE2D8] h-1.5 rounded-full mb-5 overflow-hidden">
                  <div 
                    className="bg-[#B88764] h-full transition-all duration-300 rounded-full"
                    style={{ width: `${((currentIndex + 1) / activeQuestions.length) * 100}%` }}
                  ></div>
                </div>

                {/* 題目本體卡片 */}
                <div className="bg-white border border-[#EAE3D9] rounded-3xl p-5 shadow-2xs mb-5">
                  <h2 className="text-base sm:text-lg font-bold font-serif-tc text-[#2D2725] leading-relaxed">
                    {activeQuestions[currentIndex].question}
                  </h2>
                </div>

                {/* 四個選項 */}
                <div className="space-y-2.5">
                  {activeQuestions[currentIndex].options.map((option, idx) => {
                    const currentQ = activeQuestions[currentIndex];
                    let btnStyle = "bg-white border-stone-200 hover:border-[#B88764] text-stone-700";
                    
                    if (isAnswered) {
                      if (idx === currentQ.answer) {
                        btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-bold shadow-2xs";
                      } else if (idx === selectedOption) {
                        btnStyle = "bg-rose-50 border-rose-400 text-rose-800 font-bold";
                      } else {
                        btnStyle = "bg-stone-50 border-stone-200 text-stone-400 opacity-60";
                      }
                    }

                    return (
                      <button
                        key={idx}
                        onClick={() => handleSelectOption(idx)}
                        disabled={isAnswered}
                        className={`w-full text-left p-3.5 rounded-2xl border-2 transition-all text-xs sm:text-sm flex items-center justify-between ${btnStyle}`}
                      >
                        <div className="flex items-center space-x-3">
                          <span className={`w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold ${
                            isAnswered && idx === currentQ.answer 
                              ? 'bg-emerald-500 text-white' 
                              : isAnswered && idx === selectedOption 
                              ? 'bg-rose-500 text-white' 
                              : 'bg-stone-100 text-stone-600'
                          }`}>
                            {['A', 'B', 'C', 'D'][idx]}
                          </span>
                          <span className="leading-snug">{option}</span>
                        </div>
                        {isAnswered && idx === currentQ.answer && (
                          <span className="text-emerald-600 font-bold text-xs flex-shrink-0 ml-2">✓ 正確</span>
                        )}
                        {isAnswered && idx === selectedOption && idx !== currentQ.answer && (
                          <span className="text-rose-600 font-bold text-xs flex-shrink-0 ml-2">✗ 答錯</span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* 詳解彈窗與前進按鈕 */}
              {isAnswered && (
                <div className="mt-5 bg-[#FAF7F2] border border-[#E9DECF] rounded-2xl p-4 shadow-2xs">
                  <div className="flex items-center space-x-1.5 mb-1.5">
                    <span className="text-sm">💡</span>
                    <h3 className="font-bold text-[#8C5E3C] text-xs">趣味小詳解</h3>
                  </div>
                  <p className="text-stone-700 text-xs leading-relaxed mb-4">
                    {activeQuestions[currentIndex].explanation}
                  </p>
                  <button
                    onClick={handleNext}
                    className="w-full bg-[#B88764] hover:bg-[#A37452] text-white font-bold py-3 px-4 rounded-xl shadow transition flex items-center justify-center space-x-2 text-sm"
                  >
                    <span>{currentIndex + 1 < activeQuestions.length ? '下一題' : '查看最終成績'}</span>
                    <span>➔</span>
                  </button>
                </div>
              )}

              <div className="mt-4 text-center">
                <button 
                  onClick={() => setCurrentView('home')}
                  className="text-stone-400 hover:text-stone-600 text-xs font-medium"
                >
                  結束練習返回首頁
                </button>
              </div>
            </div>
          )}

          {/* 視圖 3：結算畫面 */}
          {currentView === 'quiz' && quizCompleted && (
            <div className="bg-white border border-[#EAE3D9] rounded-[32px] p-6 text-center shadow-lg my-auto">
              <div className="w-16 h-16 bg-[#FAF5EE] text-[#B88764] rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 shadow-inner">
                🏆
              </div>
              <h2 className="text-xl font-bold font-serif-tc text-[#2D2725] mb-1">暖身挑戰完成！</h2>
              <p className="text-stone-500 text-xs mb-5">看來你已經對今天的快問快答勢在必得！</p>

              <div className="bg-[#FAF8F5] border border-[#EFE9DF] rounded-2xl p-4 mb-5 space-y-2">
                <div className="text-stone-400 text-[11px] font-bold tracking-wider uppercase">本次總得分</div>
                <div className="text-3xl font-black text-[#8C5E3C]">{score} <span className="text-sm font-normal text-stone-500">分</span></div>
                <div className="text-xs text-stone-600 pt-2 border-t border-stone-200/60">
                  答對題數：<span className="font-bold text-stone-800">{Math.round(score / 10)} / {activeQuestions.length}</span> 題
                </div>
              </div>

              <div className="space-y-2.5">
                <button
                  onClick={() => startQuiz(selectedCategory)}
                  className="w-full bg-[#B88764] hover:bg-[#A37452] text-white font-bold py-3 rounded-xl shadow transition text-xs"
                >
                  再挑戰一次此主題
                </button>
                <button
                  onClick={() => setCurrentView('home')}
                  className="w-full bg-stone-100 hover:bg-stone-200 text-stone-700 font-medium py-3 rounded-xl transition text-xs"
                >
                  返回首頁查看總熟練度
                </button>
              </div>
            </div>
          )}

          {/* 視圖 4：管理頁面 */}
          {currentView === 'admin' && (
            <div className="space-y-4 py-2">
              <div className="flex items-center justify-between">
                <h2 className="text-base font-bold text-stone-800">題庫管理</h2>
                <button 
                  onClick={() => setCurrentView('home')}
                  className="bg-[#B88764] text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow"
                >
                  返回首頁
                </button>
              </div>

              <div className="bg-white border border-[#EAE3D9] rounded-2xl p-4 shadow-2xs space-y-3">
                <h3 className="font-bold text-xs text-stone-800">快速新增測試題目</h3>
                <div className="space-y-2 text-xs">
                  <select id="new-cat" className="w-full p-2 bg-stone-50 border border-stone-200 rounded-lg">
                    <option value="groom">🤵 關於新郎 (groom)</option>
                    <option value="bride">👰 關於新娘 (bride)</option>
                    <option value="couple">💍 關於我們 (couple)</option>
                    <option value="work">💼 關於工作 (work)</option>
                    <option value="other">🎯 其他趣味 (other)</option>
                  </select>
                  <input id="new-q" type="text" placeholder="題目內容" className="w-full p-2 bg-stone-50 border border-stone-200 rounded-lg" />
                  <div className="grid grid-cols-2 gap-2">
                    <input id="opt-0" type="text" placeholder="選項 A" className="p-2 bg-stone-50 border border-stone-200 rounded-lg" />
                    <input id="opt-1" type="text" placeholder="選項 B" className="p-2 bg-stone-50 border border-stone-200 rounded-lg" />
                    <input id="opt-2" type="text" placeholder="選項 C" className="p-2 bg-stone-50 border border-stone-200 rounded-lg" />
                    <input id="opt-3" type="text" placeholder="選項 D" className="p-2 bg-stone-50 border border-stone-200 rounded-lg" />
                  </div>
                  <select id="new-ans" className="w-full p-2 bg-stone-50 border border-stone-200 rounded-lg">
                    <option value="0">正確答案：選項 A</option>
                    <option value="1">正確答案：選項 B</option>
                    <option value="2">正確答案：選項 C</option>
                    <option value="3">正確答案：選項 D</option>
                  </select>
                  <textarea id="new-exp" placeholder="趣味詳解說明" className="w-full p-2 bg-stone-50 border border-stone-200 rounded-lg h-14"></textarea>
                  <button 
                    onClick={() => {
                      const cat = document.getElementById('new-cat').value;
                      const q = document.getElementById('new-q').value;
                      const o0 = document.getElementById('opt-0').value;
                      const o1 = document.getElementById('opt-1').value;
                      const o2 = document.getElementById('opt-2').value;
                      const o3 = document.getElementById('opt-3').value;
                      const ans = parseInt(document.getElementById('new-ans').value);
                      const exp = document.getElementById('new-exp').value;

                      if (!q || !o0 || !o1 || !o2 || !o3 || !exp) {
                        alert('請填寫所有欄位！');
                        return;
                      }

                      const newQObj = {
                        id: Date.now(),
                        category: cat,
                        question: q,
                        options: [o0, o1, o2, o3],
                        answer: ans,
                        explanation: exp
                      };

                      setQuestions([newQObj, ...questions]);
                      alert('已暫存新增！永久保存請記得加入 questions.js');
                    }}
                    className="w-full bg-stone-800 text-white font-bold py-2 rounded-xl text-xs"
                  >
                    立即新增
                  </button>
                </div>
              </div>

              {/* 題庫列表 */}
              <div className="space-y-2">
                <span className="text-xs font-bold text-stone-500">目前題庫 ({questions.length} 題)</span>
                {questions.map((q, i) => (
                  <div key={q.id || i} className="bg-white border border-[#EAE3D9] rounded-xl p-3 text-xs flex items-center justify-between shadow-2xs">
                    <div className="truncate pr-2">
                      <span className="font-bold text-[#8C5E3C] mr-1.5">#{i + 1}</span>
                      <span className="text-stone-400 mr-1.5">[{q.category}]</span>
                      <span className="text-stone-800">{q.question}</span>
                    </div>
                    <button 
                      onClick={() => {
                        if (confirm('確定刪除這題嗎？')) {
                          setQuestions(questions.filter((_, idx) => idx !== i));
                        }
                      }}
                      className="text-red-500 font-bold px-1"
                    >
                      ✕
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
